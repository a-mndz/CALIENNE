name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governance:
    name: Governance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Decision register
        run: python tools/check_decision_register.py
      - name: RFC index
        run: python tools/check_rfc_index.py
      - name: ADR index
        run: python tools/check_adr_index.py
      - name: Architecture version bump
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          python tools/check_architecture_version.py --base-ref "origin/${{ github.base_ref }}"
      - name: Dependency pinning (G4)
        run: python tools/check_pins.py

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    env:
      # generate_api_reference.py imports server.py, which builds aetherisConfig
      # at module scope. Without a JWT secret the config validator refuses to
      # construct and the step dies before rendering any OpenAPI. tests/conftest.py
      # sets its own value, so this is only needed for the doc-freshness step.
      # Only the uppercase form: env_prefix is "AETHERIS_", and Actions treats
      # env keys case-insensitively, so adding the lowercase twin is a duplicate-key
      # error that invalidates the whole workflow file.
      AETHERIS_JWT_SECRET_KEY: ci-only-not-a-real-secret-32chars-minimum
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # requirements.lock is the hashed, fully-pinned resolution of
        # requirements.txt (uv pip compile). Installing it makes CI
        # reproducible; regenerate with:
        #   uv pip compile requirements.txt -o requirements.lock --generate-hashes
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Golden-set + corpus integrity (G5)
        run: python -m evals.validate
      - name: API reference up to date
        run: python tools/generate_api_reference.py --check
      - name: Tests (non-slow)
        run: python -m pytest -m "not slow" -q

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  postgres-integration:
    name: PostgreSQL integration (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt
      - name: Slow integration tests (testcontainers PostgreSQL)
        run: python -m pytest -m "slow" -q
